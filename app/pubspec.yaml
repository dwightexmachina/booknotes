name: booknotes_app
description: "Read-only web viewer for booknotes: books, notes, word counts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Static snapshot written by `booknotes export`; read only by builds made
  # with --dart-define=STATIC_DATA=true (GitHub Pages).
  assets:
    - assets/data/books.json
    - assets/data/books/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
